projects:
  - name: scout
    environments:
      - name: production
        databases:
          - name: scout-db
            plan: free
            region: oregon
            postgresMajorVersion: "16"
            ipAllowList: []

        services:
          - type: web
            name: scout-web
            runtime: node
            plan: free
            region: oregon
            rootDir: web
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run migrate && npm start
            healthCheckPath: /health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: scout-db
                  property: connectionString
              - key: WORKFLOW_SLUG
                value: draftroom
              - key: RENDER_API_KEY
                sync: false
              - key: RATE_LIMIT_SECRET
                sync: false
