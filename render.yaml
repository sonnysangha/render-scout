databases:
  - name: scout-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: scout-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: scout-web
    runtime: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scout-cache
          type: keyvalue
          property: connectionString
      - key: WORKFLOW_SLUG
        value: scout
      - key: RENDER_API_KEY
        sync: false
