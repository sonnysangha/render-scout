projects:
  - name: scout
    environments:
      - name: production
        databases:
          - name: scout-db
            plan: free
            region: oregon
            postgresMajorVersion: "16"
            ipAllowList: []

        services:
          - type: keyvalue
            name: draftroom-cache
            plan: free
            region: oregon
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

          - type: web
            name: scout-web
            runtime: node
            plan: free
            region: oregon
            rootDir: web
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run migrate && npm start
            healthCheckPath: /health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: scout-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  name: draftroom-cache
                  type: keyvalue
                  property: connectionString
              - key: WORKFLOW_SLUG
                value: draftroom
              - key: RENDER_API_KEY
                sync: false
              - key: RATE_LIMIT_SECRET
                sync: false

          - type: cron
            name: draftroom-cleanup
            runtime: node
            plan: starter
            region: oregon
            rootDir: web
            schedule: "0 3 * * *"
            buildCommand: npm ci --include=dev
            startCommand: npm run cleanup
            autoDeployTrigger: commit
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: scout-db
                  property: connectionString
